name: Finance OS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars
          JWT_EXPIRES_IN: 1h

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client/finance-ui
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/finance-ui/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
